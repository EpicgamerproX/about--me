<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achyut | Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            /* Background image */
            background-image: url('assets/1000091787.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            /* Slight blur on the bg */
            position: relative;
        }

        /* Pseudo-element that holds the blur + dark vignette on top of the bg */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;

            /* Inherit the same background so blur applies only to it */
            background-image: url('assets/1000091787.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            #cursor-blob.expanded.blackout {
                background-color: #000;
                mix-blend-mode: normal;
            }

            #cursor-blob.breaking {
                background-color: #fff !important;
                mix-blend-mode: difference !important;
                transition: all 0.1s ease !important;
                animation: shatterEffect 0.38s forwards;
            }

            /* Blur the photo */
            filter: blur(6px);
            /* Scale up slightly so blurred edges don't show white */
            transform: scale(1.05);
        }

        /* Dark vignette layer — darkens borders, keeps center bright */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(ellipse at 50% 50%,
                    rgba(0, 0, 0, 0.0) 20%,
                    rgba(0, 0, 0, 0.5) 60%,
                    rgba(0, 0, 0, 0.85) 100%);
        }

        /* All page content sits above the bg layers */
        main {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        .center-image {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(calc(-50% - 8vw), calc(-50% + 22vh)) scale(1.07);
            width: 80vw;
            height: auto;
            z-index: 2;
        }

        .reveal-sub {
            font-size: 1.5rem;
            color: #888;
            margin-top: 20px;
            font-family: monospace;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 3.5rem;
                line-height: 1;
                margin-bottom: 1.618rem;
            }

            p {
                font-size: 1.1rem;
                max-width: 100%;
            }

            .layer {
                padding: 0 8vw;
            }

            .mobile-hint {
                display: block;
            }

            .skill-sidebar {
                width: 85%;
                min-width: unset;
                padding: 80px 30px 40px 30px;
            }

            #cursor-blob {
                width: 100px;
                height: 100px;
            }

            .pull-indicator {
                right: 10px;
            }

            .pull-text {
                display: none;
            }

            .spacer {
                height: 25vh;
            }

            #final-layer h1 {
                font-size: 8vw;
            }

            .glass-grid {
                width: 25vw;
            }

            #project-showcase {
                flex-direction: column;
                justify-content: flex-start;
                padding-top: 60px;
                padding-bottom: 120px;
            }

            .project-card {
                height: auto;
                min-height: 250px;
                margin-bottom: 20px;
                flex: none;
            }

            .btn.fill-trigger {
                position: relative;
                right: auto;
                top: auto;
                transform: none;
                margin-top: 20px;
            }

            .btn-drain {
                width: 60px;
                height: 60px;
                bottom: 30px;
                right: 30px;
            }

            .shutter-left,
            .shutter-right {
                font-size: 0.6rem;
            }
        }
    </style>
</head>

<body>
    <main>
        <img class="center-image" src="assets/20261113_184858.png" alt="Achyut">
    </main>
</body>

</html>
